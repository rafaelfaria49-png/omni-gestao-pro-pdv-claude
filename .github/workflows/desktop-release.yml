name: Desktop Release pública (assinada)

# Distribuição OFICIAL do OmniGestão Pro para Windows — separada do CI de PR (desktop-windows.yml).
#
#   action=publish  → build Production ASSINADO (Authenticode SHA-256 + carimbo RFC 3161), verificação
#                     estrita, envio IMUTÁVEL ao armazenamento de downloads (Cloudflare R2 + CDN), download
#                     de volta pela URL PÚBLICA, conferência de SHA-256 e certificado do arquivo baixado,
#                     instalação real DESSE arquivo e gravação de release.json da versão.
#                     NÃO muda a versão oferecida aos clientes.
#   action=promote  → valida o release.json com o mesmo contrato da página, baixa e confere de novo e aponta
#                     latest.json para essa versão. Rollback = promote de uma versão anterior.
#
# Nada aqui roda em pull_request. Segredos e variáveis ficam no environment `desktop-release` (com revisores
# obrigatórios configurados pelo proprietário). Sem certificado, o job FALHA: executável não assinado nunca
# vira download comercial. Certificados aceitos vêm de vars.OMNI_DESKTOP_TRUSTED_SHA1 — nunca do manifesto
# que está sendo conferido. A página /baixar só oferece o arquivo com DESKTOP_PUBLIC_DOWNLOAD=on.
#
# Valores vindos da CDN ou de inputs nunca são interpolados com ${{ }} em scripts: entram por env e são
# validados antes do uso.

on:
  workflow_dispatch:
    inputs:
      action:
        description: "publish = gerar e enviar nova versão · promote = tornar uma versão publicada a oficial (ou rollback)"
        type: choice
        options: [publish, promote]
        default: publish
      version:
        description: "Somente para promote: versão já publicada (ex.: 1.0.4)"
        type: string
        default: ""
      notes:
        description: "Somente para publish: nota curta da versão (opcional)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: desktop-release
  cancel-in-progress: false

env:
  AWS_DEFAULT_REGION: auto
  # Cloudflare R2 (API S3). Sem as proteções de checksum novas do AWS CLI, que o R2 pode recusar.
  AWS_REQUEST_CHECKSUM_CALCULATION: when_required
  AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
  RELEASES_BASE_URL: ${{ vars.OMNI_DESKTOP_RELEASES_BASE_URL }}
  R2_BUCKET: ${{ vars.OMNI_DESKTOP_R2_BUCKET }}
  TRUSTED_SHA1: ${{ vars.OMNI_DESKTOP_TRUSTED_SHA1 }}

jobs:
  publish:
    if: inputs.action == 'publish' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 75
    environment: desktop-release
    defaults:
      run:
        working-directory: apps/desktop
        shell: pwsh
    env:
      AWS_ENDPOINT_URL_S3: ${{ secrets.OMNI_DESKTOP_R2_ENDPOINT }}
      AWS_ACCESS_KEY_ID: ${{ secrets.OMNI_DESKTOP_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.OMNI_DESKTOP_R2_SECRET_ACCESS_KEY }}
      SIGN_PROVIDER: ${{ vars.OMNI_DESKTOP_SIGN_PROVIDER }}
      OMNI_DESKTOP_TIMESTAMP_URL: ${{ vars.OMNI_DESKTOP_TIMESTAMP_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Sem cache de dependências neste job (tem acesso ao certificado): tudo vem do npm ci limpo.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Exigir armazenamento, assinatura e certificados confiáveis configurados
        run: |
          $missing = @()
          foreach ($n in "RELEASES_BASE_URL","R2_BUCKET","TRUSTED_SHA1","AWS_ENDPOINT_URL_S3","AWS_ACCESS_KEY_ID","AWS_SECRET_ACCESS_KEY","SIGN_PROVIDER","OMNI_DESKTOP_TIMESTAMP_URL") {
            if (-not [Environment]::GetEnvironmentVariable($n)) { $missing += $n }
          }
          if ($env:SIGN_PROVIDER -notin @("store","pfx")) { $missing += "OMNI_DESKTOP_SIGN_PROVIDER (store|pfx)" }
          if ($missing.Count) { Write-Error "Configuração ausente no environment desktop-release: $($missing -join ', '). Ver docs/desktop/DISTRIBUICAO_PUBLICA.md"; exit 1 }
          if ($env:RELEASES_BASE_URL -notmatch '^https://[A-Za-z0-9.-]+$' -or $env:RELEASES_BASE_URL -match '\.vercel\.app$') { Write-Error "OMNI_DESKTOP_RELEASES_BASE_URL deve ser só a origem https da CDN de downloads"; exit 1 }

      # ---- certificado ------------------------------------------------------------------------
      # store: o fornecedor (HSM em nuvem) expõe o certificado em Cert:\CurrentUser\My por KSP/CSP.
      #        Acrescente aqui, ANTES deste passo, a instalação/login da ferramenta do fornecedor
      #        (ver docs). O thumbprint vem de vars.OMNI_DESKTOP_SIGN_SHA1.
      # pfx:   certificado .pfx (legado) em segredo base64; importado só neste runner descartável.
      - name: Certificado — repositório do Windows (HSM do fornecedor)
        if: env.SIGN_PROVIDER == 'store'
        env:
          SIGN_SHA1: ${{ vars.OMNI_DESKTOP_SIGN_SHA1 }}
        run: |
          if ($env:SIGN_SHA1 -notmatch '^[0-9a-fA-F]{40}$') { Write-Error "vars.OMNI_DESKTOP_SIGN_SHA1 ausente/inválido"; exit 1 }
          # signtool /sha1 sem /sm procura só no repositório do usuário.
          $c = Get-ChildItem Cert:\CurrentUser\My | Where-Object Thumbprint -eq $env:SIGN_SHA1.ToUpper() | Select-Object -First 1
          if (-not $c) { Write-Error "Certificado $($env:SIGN_SHA1) não está em Cert:\CurrentUser\My — a ferramenta do fornecedor foi configurada?"; exit 1 }
          if ($c.NotAfter -lt (Get-Date).AddDays(7)) { Write-Error "Certificado vence em menos de 7 dias ($($c.NotAfter))"; exit 1 }
          "OMNI_DESKTOP_SIGN_SHA1=$($env:SIGN_SHA1.ToLower())" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Certificado — .pfx (legado)
        if: env.SIGN_PROVIDER == 'pfx'
        env:
          PFX_BASE64: ${{ secrets.OMNI_DESKTOP_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.OMNI_DESKTOP_PFX_PASSWORD }}
        run: |
          if (-not $env:PFX_BASE64 -or -not $env:PFX_PASSWORD) { Write-Error "segredos OMNI_DESKTOP_PFX_BASE64/OMNI_DESKTOP_PFX_PASSWORD ausentes"; exit 1 }
          $pfx = Join-Path $env:RUNNER_TEMP "omni-sign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_BASE64))
          $pw = ConvertTo-SecureString $env:PFX_PASSWORD -AsPlainText -Force
          # O .pfx pode trazer a cadeia: o certificado de assinatura é o que tem chave privada.
          $c = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pw | Where-Object HasPrivateKey | Select-Object -First 1
          Remove-Item $pfx -Force
          if (-not $c) { Write-Error ".pfx sem certificado com chave privada"; exit 1 }
          if ($c.NotAfter -lt (Get-Date).AddDays(7)) { Write-Error "Certificado vence em menos de 7 dias ($($c.NotAfter))"; exit 1 }
          "OMNI_DESKTOP_SIGN_SHA1=$($c.Thumbprint.ToLower())" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Certificado de assinatura está na lista confiável
        run: |
          $trusted = $env:TRUSTED_SHA1.ToLower() -split '[,\s]+' | Where-Object { $_ -match '^[0-9a-f]{40}$' }
          if ($env:OMNI_DESKTOP_SIGN_SHA1 -notin $trusted) { Write-Error "O certificado $($env:OMNI_DESKTOP_SIGN_SHA1) não está em vars.OMNI_DESKTOP_TRUSTED_SHA1 (nem a página aceitaria)"; exit 1 }

      # ---- build ------------------------------------------------------------------------------
      - run: npm ci --no-audit --no-fund
      - run: node node_modules/electron/install.js
      - run: node scripts/prepare-installer-tools.mjs
      - run: npm run typecheck
      - run: npm test
      - name: Gerar instalador ASSINADO (canal production)
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $ErrorActionPreference = "Stop"
          npm run build
          node scripts/write-build-config.mjs --channel production
          npx electron-forge make
      - run: node scripts/check-fuses.mjs out/OmniGestaoPro-win32-x64/OmniGestaoPro.exe
      - name: Verificação estrita (assinatura Valid + carimbo + mesmo certificado)
        run: node scripts/verify-artifacts.mjs --require-signed

      # A partir daqui nada mais é assinado: o certificado sai do runner antes de executar qualquer
      # instalador (o atual ou o anterior baixado da CDN).
      - name: Remover certificado importado (.pfx)
        if: always() && env.SIGN_PROVIDER == 'pfx'
        run: |
          if ($env:OMNI_DESKTOP_SIGN_SHA1) { Get-ChildItem Cert:\CurrentUser\My | Where-Object Thumbprint -eq $env:OMNI_DESKTOP_SIGN_SHA1.ToUpper() | Remove-Item -Force -ErrorAction SilentlyContinue }

      - name: Versão nova e imutável no armazenamento
        id: meta
        run: |
          $art = Get-Content out/make/squirrel.windows/x64/artifacts.json -Raw | ConvertFrom-Json
          $v = [string]$art.version
          if ($v -notmatch '^\d{1,4}\.\d{1,4}\.\d{1,6}$') { Write-Error "versão inválida em artifacts.json"; exit 1 }
          $key = "desktop/production/$v/OmniGestaoPro-Setup.exe"
          $out = aws s3api head-object --bucket $env:R2_BUCKET --key $key 2>&1 | Out-String
          $code = $LASTEXITCODE
          $global:LASTEXITCODE = 0
          if ($code -eq 0) { Write-Error "A versão $v já existe no armazenamento (release imutável). Suba a versão no package.json."; exit 1 }
          if ($out -notmatch '\(404\)|Not Found') { Write-Error "Não foi possível consultar o armazenamento (exit $code): $out"; exit 1 }
          $sha = ($art.files | Where-Object file -eq "OmniGestaoPro-Setup.exe").sha256
          "version=$v" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          "sha256=$sha" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          "key=$key" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          exit 0

      - name: Versão oficial anterior (para testar atualização sobre ela)
        id: previous
        run: |
          New-Item -ItemType Directory -Force out/previous | Out-Null
          $r = Invoke-WebRequest -Uri "$env:RELEASES_BASE_URL/desktop/production/latest.json" -MaximumRedirection 0 -SkipHttpErrorCheck -OutFile out/previous/latest.json -PassThru
          if ($r.StatusCode -eq 404) { "found=false" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT; exit 0 }
          if ($r.StatusCode -ne 200) { Write-Error "latest.json respondeu HTTP $($r.StatusCode) — sem ele não dá para testar a atualização; tente de novo"; exit 1 }
          # Mesmo contrato da página; certificado conferido contra a lista confiável, não contra o manifesto.
          node --input-type=module -e "import fs from 'node:fs'; import { checkReleaseManifest, parseTrustedThumbprints } from './scripts/lib/release-manifest-builder.mjs'; const r = checkReleaseManifest(JSON.parse(fs.readFileSync('out/previous/latest.json','utf8')), process.env.RELEASES_BASE_URL, parseTrustedThumbprints(process.env.TRUSTED_SHA1)); fs.writeFileSync('out/previous/checked.json', JSON.stringify(r))"
          if ($LASTEXITCODE -ne 0) { Write-Error "latest.json atual não passa no contrato — investigar antes de publicar"; exit 1 }
          $prev = Get-Content out/previous/checked.json -Raw | ConvertFrom-Json
          node scripts/verify-published-release.mjs --url $prev.url --sha256 $prev.sha256 --trusted $env:TRUSTED_SHA1 --out out/previous/OmniGestaoPro-Setup.exe
          if ($LASTEXITCODE -ne 0) { Write-Error "A versão oficial atual não confere mais na CDN — investigar antes de publicar"; exit 1 }
          "found=true" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          "version=$($prev.version)" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT

      # ---- envio imutável e prova pelo download público ----------------------------------------
      - name: Enviar ao armazenamento (sem sobrescrever)
        env:
          KEY: ${{ steps.meta.outputs.key }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $ErrorActionPreference = "Stop"
          $dir = "out/make/squirrel.windows/x64"
          $imm = "public, max-age=31536000, immutable"
          aws s3api put-object --bucket $env:R2_BUCKET --key $env:KEY --body "$dir/OmniGestaoPro-Setup.exe" --if-none-match "*" --content-type "application/vnd.microsoft.portable-executable" --content-disposition 'attachment; filename="OmniGestaoPro-Setup.exe"' --cache-control $imm | Out-Null
          aws s3api put-object --bucket $env:R2_BUCKET --key "desktop/production/$env:VERSION/SHA256SUMS.txt" --body "$dir/SHA256SUMS.txt" --if-none-match "*" --content-type "text/plain; charset=utf-8" --cache-control $imm | Out-Null
          aws s3api put-object --bucket $env:R2_BUCKET --key "desktop/production/$env:VERSION/artifacts.json" --body "$dir/artifacts.json" --if-none-match "*" --content-type "application/json" --cache-control $imm | Out-Null

      - name: Baixar pela URL pública e conferir SHA-256 + certificado
        env:
          KEY: ${{ steps.meta.outputs.key }}
          SHA: ${{ steps.meta.outputs.sha256 }}
        run: |
          New-Item -ItemType Directory -Force out/public | Out-Null
          node scripts/verify-published-release.mjs --url "$env:RELEASES_BASE_URL/$env:KEY" --sha256 $env:SHA --trusted $env:OMNI_DESKTOP_SIGN_SHA1 --out out/public/OmniGestaoPro-Setup.exe --report out/public/public-check.json
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # Uma única instalação real por runner (restos do Squirrel e o perfil impedem a 2ª), feita sobre o
      # MESMO arquivo que os clientes baixam. Com versão oficial anterior, o arquivo novo é testado como
      # ATUALIZAÇÃO sobre ela (caso real das lojas); a instalação nova do mesmo código é coberta em toda PR
      # pelo desktop-windows.yml. Se falhar, a versão fica enviada mas sem release.json nem latest.json:
      # nunca é oferecida; corrija e publique uma versão nova.
      - name: Instalação real do ARQUIVO BAIXADO
        env:
          PREV_FOUND: ${{ steps.previous.outputs.found }}
          PREV_VERSION: ${{ steps.previous.outputs.version }}
          NEW_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          if ($env:PREV_FOUND -eq "true") {
            if ($env:PREV_VERSION -notmatch '^\d{1,4}\.\d{1,4}\.\d{1,6}$') { Write-Error "versão anterior inválida"; exit 1 }
            node tests/packaged/install-test.mjs --channel production --setup out/previous/OmniGestaoPro-Setup.exe --expect-version $env:PREV_VERSION --upgrade-setup out/public/OmniGestaoPro-Setup.exe --expect-upgrade-version $env:NEW_VERSION
          } else {
            node tests/packaged/install-test.mjs --channel production --setup out/public/OmniGestaoPro-Setup.exe --expect-version $env:NEW_VERSION
          }
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Gravar release.json da versão (latest.json NÃO muda aqui)
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          NOTES: ${{ inputs.notes }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $ErrorActionPreference = "Stop"
          node scripts/write-release-manifest.mjs --base $env:RELEASES_BASE_URL --artifacts out/make/squirrel.windows/x64/artifacts.json --public-check out/public/public-check.json --install-test passed --out-dir out/manifest --notes "$env:NOTES"
          node --input-type=module -e "import fs from 'node:fs'; import { checkReleaseManifest, parseTrustedThumbprints } from './scripts/lib/release-manifest-builder.mjs'; checkReleaseManifest(JSON.parse(fs.readFileSync('out/manifest/release.json','utf8')), process.env.RELEASES_BASE_URL, parseTrustedThumbprints(process.env.TRUSTED_SHA1))"
          aws s3api put-object --bucket $env:R2_BUCKET --key "desktop/production/$env:VERSION/release.json" --body out/manifest/release.json --if-none-match "*" --content-type "application/json" --cache-control "public, max-age=31536000, immutable" | Out-Null
          Get-Content out/manifest/release.json

      - name: Relatórios (sem o executável)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-release-${{ steps.meta.outputs.version || 'falhou' }}
          retention-days: 90
          if-no-files-found: warn
          path: |
            apps/desktop/out/make/squirrel.windows/x64/SHA256SUMS.txt
            apps/desktop/out/make/squirrel.windows/x64/artifacts.json
            apps/desktop/out/public/public-check.json
            apps/desktop/out/manifest/release.json
            apps/desktop/test-results/install-test-production.json

  promote:
    if: inputs.action == 'promote' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 20
    environment: desktop-release
    defaults:
      run:
        working-directory: apps/desktop
        shell: pwsh
    env:
      AWS_ENDPOINT_URL_S3: ${{ secrets.OMNI_DESKTOP_R2_ENDPOINT }}
      AWS_ACCESS_KEY_ID: ${{ secrets.OMNI_DESKTOP_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.OMNI_DESKTOP_R2_SECRET_ACCESS_KEY }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validar entrada e configuração
        run: |
          if ($env:VERSION -notmatch '^\d{1,4}\.\d{1,4}\.\d{1,6}$') { Write-Error "informe a versão publicada (ex.: 1.0.4)"; exit 1 }
          if (-not $env:RELEASES_BASE_URL -or -not $env:R2_BUCKET -or -not $env:TRUSTED_SHA1) { Write-Error "armazenamento/certificados confiáveis não configurados"; exit 1 }
      - name: Validar release.json (contrato da página) e conferir o instalador pela URL pública
        run: |
          New-Item -ItemType Directory -Force out/promote | Out-Null
          $r = Invoke-WebRequest -Uri "$env:RELEASES_BASE_URL/desktop/production/$env:VERSION/release.json" -MaximumRedirection 0 -SkipHttpErrorCheck -OutFile out/promote/release.json -PassThru
          if ($r.StatusCode -ne 200) { Write-Error "release.json da versão $env:VERSION: HTTP $($r.StatusCode)"; exit 1 }
          node --input-type=module -e "import fs from 'node:fs'; import { checkReleaseManifest, parseTrustedThumbprints } from './scripts/lib/release-manifest-builder.mjs'; const r = checkReleaseManifest(JSON.parse(fs.readFileSync('out/promote/release.json','utf8')), process.env.RELEASES_BASE_URL, parseTrustedThumbprints(process.env.TRUSTED_SHA1)); if (r.version !== process.env.VERSION) throw new Error('versão divergente'); fs.writeFileSync('out/promote/checked.json', JSON.stringify(r))"
          if ($LASTEXITCODE -ne 0) { Write-Error "release.json não passa no contrato da página"; exit 1 }
          $rel = Get-Content out/promote/checked.json -Raw | ConvertFrom-Json
          node scripts/verify-published-release.mjs --url $rel.url --sha256 $rel.sha256 --trusted $env:TRUSTED_SHA1 --out out/promote/OmniGestaoPro-Setup.exe
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Tornar oficial (latest.json) e registrar no histórico
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $ErrorActionPreference = "Stop"
          $h = Invoke-WebRequest -Uri "$env:RELEASES_BASE_URL/desktop/production/versions.json" -MaximumRedirection 0 -SkipHttpErrorCheck -OutFile out/promote/versions-current.json -PassThru
          if ($h.StatusCode -eq 404) { Remove-Item out/promote/versions-current.json -ErrorAction SilentlyContinue }
          elseif ($h.StatusCode -ne 200) { Write-Error "versions.json: HTTP $($h.StatusCode) — não reescrever o histórico às cegas"; exit 1 }
          node --input-type=module -e "import fs from 'node:fs'; import { appendHistory } from './scripts/lib/release-manifest-builder.mjs'; const rel=JSON.parse(fs.readFileSync('out/promote/release.json','utf8')); const cur=fs.existsSync('out/promote/versions-current.json')?JSON.parse(fs.readFileSync('out/promote/versions-current.json','utf8')):null; fs.writeFileSync('out/promote/versions.json', JSON.stringify(appendHistory(cur, rel), null, 2)+'\n')"
          aws s3api put-object --bucket $env:R2_BUCKET --key "desktop/production/versions.json" --body out/promote/versions.json --content-type "application/json" --cache-control "public, max-age=60" | Out-Null
          aws s3api put-object --bucket $env:R2_BUCKET --key "desktop/production/latest.json" --body out/promote/release.json --content-type "application/json" --cache-control "public, max-age=60" | Out-Null
          Write-Host "latest.json → $env:VERSION. A página /baixar reflete em até ~5 min (cache da Vercel) e só com DESKTOP_PUBLIC_DOWNLOAD=on."

name: Ramos e Cadastros

on:
  pull_request:
    paths:
      - "lib/store-business*"
      - "lib/use-store-business*"
      - "lib/store-settings*"
      - "lib/perfil-loja*"
      - "lib/capabilities-persistence*"
      - "lib/pdv-settings-server-first*"
      - "lib/pdv/resolve-capability*"
      - "lib/pdv/capability-support-matrix*"
      - "lib/cadastros/**"
      - "lib/ops-upsert-venda*"
      - "app/api/stores/**/settings/**"
      - "app/api/settings/perfil-loja/**"
      - "app/api/ops/venda-persist/**"
      - "app/api/vendas/**/corrigir-itens/**"
      - "app/api/produtos/**"
      - "app/api/stores/import-catalog/**"
      - "app/actions/cadastros*"
      - "app/actions/estoque*"
      - "lib/operacoes/adapters/os-estoque*"
      - "components/cadastros/**"
      - "components/configuracoes-v3/**"
      - "components/dashboard/app-ops-providers.tsx"
      - "components/dashboard/configuracoes/gestao-unidades-saas.tsx"
      - "scripts/cadastros/smoke-ramos.mjs"
      - "scripts/cadastros/run-ramos-isolated-postgres.mjs"
      - ".github/workflows/ramos-cadastros.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://test:test@127.0.0.1:1/isolated?connect_timeout=1
      DIRECT_URL: postgresql://test:test@127.0.0.1:1/isolated?connect_timeout=1
      AUTH_SECRET: isolated-ramo-fixture-with-no-production-authority
      AUTH_TRUST_HOST: "true"
      NEXTAUTH_URL: http://127.0.0.1:3000
      VERCEL: "0"
      VERCEL_ENV: development
      MIGRATION_AUTHORITY_ENABLED: "false"
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Contratos, isolamento, patch e regressões
        run: >-
          node node_modules/vitest/vitest.mjs run
          lib/store-business-capabilities.test.ts lib/store-settings-business.component.test.ts
          lib/store-settings-put.test.ts lib/store-settings-request-epoch.test.ts
          lib/pdv-settings-server-first.test.ts lib/pdv/capability-runtime.test.ts
          lib/cadastros/business-catalog.component.test.ts lib/cadastros/product-write-service.test.ts
          lib/cadastros/product-rest-007.test.ts lib/cadastros/product-write-create-tx-014.test.ts
          lib/cadastros/produto-upsert-metadata.test.ts
          lib/ops-upsert-venda.test.ts lib/ops-upsert-venda-fractional.test.ts
          lib/vendas/sale-quantity-contract.test.ts
          app/api/stores/[id]/settings/route.test.ts
          app/api/settings/perfil-loja/route.test.ts
          app/api/ops/venda-persist/route.test.ts app/api/ops/venda-persist/v2/route.test.ts
          app/api/vendas/[id]/corrigir-itens/route.business.test.ts
          app/api/produtos/[id]/route.test.ts app/api/stores/import-catalog/route.canonical-014.test.ts
          app/actions/cadastros.product-interactive.test.ts app/actions/estoque.access.test.ts
          lib/operacoes/adapters/os-estoque.test.ts
          --maxWorkers=2
      - name: Lint dos contratos e interfaces
        run: >-
          node node_modules/eslint/bin/eslint.js
          lib/store-business-capabilities.ts lib/use-store-business.ts
          lib/cadastros/product-commercial-contract.ts lib/cadastros/product-write-service.ts
          lib/capabilities-persistence-v1.ts lib/pdv-settings-server-first.ts
          lib/store-settings-provider.tsx lib/perfil-loja-provider.tsx
          components/configuracoes-v3/features/settings/components/BusinessResourcesCard.tsx
          components/cadastros/lovable/components/cadastros/produto-ia.tsx
          components/cadastros/lovable/components/cadastros/CadastrosHub.tsx
          scripts/cadastros/smoke-ramos.mjs
          app/actions/cadastros.ts app/actions/estoque.ts
          app/api/produtos/[id]/route.ts app/api/stores/import-catalog/route.ts
          app/api/vendas/[id]/corrigir-itens/route.ts lib/operacoes/adapters/os-estoque.ts
          components/configuracoes-v3/features/settings/sections/AparenciaSection.tsx
      - name: TypeScript completo
        run: npm run typecheck
      - name: Build isolado sem migrations
        run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Smoke dos componentes reais em desktop e celular
        run: node scripts/cadastros/smoke-ramos.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ramos-cadastros-smoke
          path: test-results/ramos/

  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cad_r2_021
          POSTGRES_PASSWORD: isolated_ci_only
          POSTGRES_DB: cad_r2_021_isolated
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cad_r2_021 -d cad_r2_021_isolated"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://cad_r2_021:isolated_ci_only@127.0.0.1:5432/cad_r2_021_isolated
      DIRECT_URL: postgresql://cad_r2_021:isolated_ci_only@127.0.0.1:5432/cad_r2_021_isolated
      CAD_R2_021_DISPOSABLE_DB: "true"
      MIGRATION_AUTHORITY_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Rollback, replay e concorrência em PostgreSQL real
        run: node scripts/cadastros/run-ramos-isolated-postgres.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ramos-postgres-evidence
          path: test-results/ramos/postgres-*.json

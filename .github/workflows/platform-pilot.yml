name: Plataforma - acesso piloto
on:
  pull_request:
    paths:
      - "auth*"
      - "proxy.ts"
      - "next.config.mjs"
      - "scripts/vercel-build*"
      - "lib/auth/**"
      - "lib/navigation/**"
      - "lib/cadastros/**"
      - "lib/loja-ativa.tsx"
      - "lib/store-basics*"
      - "lib/use-store-basics*"
      - "lib/operacoes-v3/**"
      - "lib/contador/**"
      - "app/**"
      - "components/**"
      - "prisma/**"
      - "e2e/platform-pilot*"
      - "e2e/platform-pilot/**"
      - "scripts/platform/**"
      - "docs/platform/**"
      - ".github/workflows/platform-pilot.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://test:test@127.0.0.1:1/isolated
      DIRECT_URL: postgresql://test:test@127.0.0.1:1/isolated
      MIGRATION_AUTHORITY_ENABLED: "false"
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: node --test scripts/platform/verify-proxy-prisma-artifact.test.mjs scripts/vercel-build.test.mjs scripts/migration-authority-guard.test.mjs
      - run: node node_modules/vitest/vitest.mjs run lib/auth/pilot-access.test.ts lib/auth/enterprise-permissions.test.ts lib/auth/proxy-enterprise-dashboard.test.ts lib/auth/session-entitlement.test.ts lib/loja-ativa.pilot-context.test.ts app/actions/operacoes.pilot-access.test.ts --maxWorkers=1
      - name: Experiência do cliente básico (apresentação, patches de Configurações)
        run: node node_modules/vitest/vitest.mjs run lib/navigation/client-experience.test.ts components/configuracoes-v3/features/settings/sections/settings-patch.test.ts components/configuracoes-v3/features/settings/client-settings.component.test.ts lib/cadastros/business-catalog.component.test.ts --maxWorkers=1
      - name: Regressões de dados básicos e recuperação
        run: node node_modules/vitest/vitest.mjs run lib/store-basics.test.ts lib/use-store-basics.component.test.ts components/onboarding/first-access-wizard.component.test.ts components/auth/SessionProvider.first-access.component.test.ts --maxWorkers=1
      - name: Lint do primeiro acesso e configurações
        run: node node_modules/eslint/bin/eslint.js lib/store-basics.ts lib/store-basics.test.ts lib/use-store-basics.ts lib/use-store-basics.component.test.ts components/onboarding/first-access-wizard.tsx components/configuracoes-v3/features/settings/sections/GeralSection.tsx lib/loja-ativa.tsx app/api/stores/\[id\]/route.ts e2e/platform-pilot/first-access.spec.ts scripts/platform/run-pilot-e2e.mjs lib/navigation/client-experience.ts components/configuracoes-v3/features/settings/sections/VendasSection.tsx components/configuracoes-v3/features/settings/sections/ImpressaoPdvSettingsCard.tsx components/configuracoes-v3/features/settings/sections/settings-patch.ts components/dashboard/estoque/estoque-cliente.tsx app/dashboard/estoque/page.tsx e2e/platform-pilot/client-experience.spec.ts
      - run: npm run typecheck
  authenticated:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: platform_pilot
          POSTGRES_PASSWORD: isolated_ci_only
          POSTGRES_DB: platform_pilot_isolated
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U platform_pilot -d platform_pilot_isolated"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://platform_pilot:isolated_ci_only@127.0.0.1:5432/platform_pilot_isolated
      DIRECT_URL: postgresql://platform_pilot:isolated_ci_only@127.0.0.1:5432/platform_pilot_isolated
      PLATFORM_PILOT_DISPOSABLE_DB: "true"
      MIGRATION_AUTHORITY_ENABLED: "false"
      VERCEL: "0"
      VERCEL_ENV: development
      NODE_OPTIONS: --max-old-space-size=6144
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci --no-audit --no-fund
      - name: Build sem autoridade de migration
        run: |
          set -o pipefail
          npm run build | tee /tmp/pilot-build.log
          grep -q PROXY_PRISMA_ARTIFACT_VERIFIED /tmp/pilot-build.log
          grep -q MIGRATION_SKIPPED /tmp/pilot-build.log
        env:
          AUTH_SECRET: isolated-platform-build-only
          AUTH_TRUST_HOST: "true"
          NEXTAUTH_URL: http://localhost:3000
      - run: npx playwright install --with-deps chromium
      - name: Migration aditiva e E2E autenticado real em banco vazio
        run: node scripts/platform/run-pilot-e2e.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: platform-pilot-evidence
          path: test-results/platform-pilot/
